name: Trivy

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - '!**_test.go'
  schedule:
    - cron: '0 4 * * 0'   # every Sunday at 06:00 CEST (04:00 UTC)
  workflow_dispatch:

jobs:
  fs-scan:
    name: Scan filesystem
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  image-scan:
    name: Scan container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Get image tag from Chart.yaml
        id: chart
        run: |
          echo "tag=$(grep '^appVersion:' charts/cert-manager-webhook-infoblox/Chart.yaml | awk '{print $2}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: tazthemaniac/cert-manager-webhook-infoblox:${{ steps.chart.outputs.tag }}

      - name: Run Trivy vulnerability scanner on built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tazthemaniac/cert-manager-webhook-infoblox:${{ steps.chart.outputs.tag }}
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image